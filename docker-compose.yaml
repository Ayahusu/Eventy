services:
  web:
    build:
      context: .
    container_name: event_web
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - static_volume:/event/staticfiles  # <--- Matches WORKDIR /event
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: event_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/event/staticfiles  # <--- Shared same volume
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_volume: